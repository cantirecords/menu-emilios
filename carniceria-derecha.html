:root{
  --red:#E31837;
  --red-dk:#C1101D;
  --red-deep:#A50E19;
  --yellow:#ffde59;
  --green:#00843D;
  --green-lt:#3bb56a;
  --white:#ffffff;
  --ink:#141414;
  --ff:'Fredoka','Trebuchet MS',sans-serif;
  --card-radius:26px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#2a0a0d;font-family:var(--ff);color:#fff;-webkit-font-smoothing:antialiased;}
body{padding:56px 24px 120px;}

/* ---------- page shell (not part of the TV canvas) ---------- */
.page-head{max-width:1100px;margin:0 auto 40px;text-align:center;}
.page-head h1{font-size:34px;font-weight:700;letter-spacing:.5px;color:#fff;}
.page-head h1 span{color:var(--yellow);}
.page-head p{margin-top:10px;font-size:16px;font-weight:500;line-height:1.5;color:#e7c9cc;}
.note{max-width:1100px;margin:0 auto 44px;background:rgba(255,222,89,.1);border:1px solid rgba(255,222,89,.35);border-radius:14px;padding:16px 20px;font-size:14px;line-height:1.55;color:#ffe9a8;}
.note b{color:var(--yellow);}

.screen-label{max-width:1100px;margin:0 auto 14px;display:flex;align-items:center;gap:14px;}
.screen-label .num{width:40px;height:40px;border-radius:50%;background:var(--yellow);color:var(--red-dk);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.screen-label .txt{font-size:19px;font-weight:600;color:#fff;}
.screen-label .txt small{display:block;font-size:13px;font-weight:500;color:#d9a7ac;letter-spacing:.3px;}

/* Responsive 1920x1080 scaler */
.stage{max-width:1100px;margin:0 auto 60px;}
.frame-wrap{position:relative;width:100%;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);}
.screen{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;}

/* ---------- the TV canvas ---------- */
.canvas{position:absolute;inset:0;background:var(--red);overflow:hidden;}
.splash-ov{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;background:#E31837;display:flex;align-items:center;justify-content:center;z-index:50;transition:opacity .8s ease;}
.splash-ov::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,0.15) 12%,transparent 15%);background-size:30px 30px;}
.splash-ov img{width:420px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.4));animation:splashIn 1.1s cubic-bezier(.2,.8,.2,1) both, splashPulse 1.8s ease-in-out 1.1s infinite;position:relative;z-index:1;}
@keyframes splashIn{0%{transform:scale(.6);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.splash-ov.hide{opacity:0;pointer-events:none;}
.canvas::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,0.16) 14%,transparent 15%);background-size:30px 30px;z-index:0;}
.canvas>*{position:relative;z-index:1;}

/* corner logo */
.corner-logo{position:absolute;top:32px;right:40px;width:108px;height:108px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));z-index:5;}

/* section header (badge + title) */
.sec-head{display:flex;align-items:center;gap:24px;margin-bottom:20px;}
.icon-badge{flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--yellow);border-radius:28px;padding:16px 22px;box-shadow:0 12px 26px rgba(0,0,0,.3);}
.icon-badge .ico{line-height:1;filter:brightness(0);}
.sec-title{font-weight:700;color:var(--white);line-height:.95;text-shadow:5px 5px 0 var(--red-deep);white-space:nowrap;}
.sec-sub{font-weight:600;color:var(--yellow);letter-spacing:2px;font-size:22px;margin-top:8px;}

/* price cards */
.card{position:relative;background:var(--white);border-radius:28px;box-shadow:0 20px 46px rgba(0,0,0,.36);padding:30px 36px;}
.card::before{content:'';position:absolute;top:0;left:36px;right:36px;height:8px;background:var(--green);border-radius:0 0 8px 8px;}
.card-grid{display:grid;grid-template-columns:1fr 1fr;height:100%;}
.pl-col{display:flex;flex-direction:column;justify-content:space-between;height:100%;}
.pl-row{display:flex;align-items:baseline;gap:14px;}
.pl-name{color:var(--red-dk);font-weight:600;white-space:nowrap;}
.pl-lead{flex:1;border-bottom:3px dotted rgba(197,16,29,.22);transform:translateY(-7px);min-width:14px;}
.pl-price{color:var(--red);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* image slot — espacio publicitario intercambiable (promo, contacto) */
/* mismo radio/borde/sombra que .card para que se vea a nivel branding */
.img-slot{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;border:5px solid #fff;box-shadow:0 20px 46px rgba(0,0,0,.36);background:#fff2;}
.img-slot img{display:block;width:100%;height:100%;object-fit:cover;}

/* video reel */
.reel{position:relative;width:100%;height:100%;background:linear-gradient(160deg,#2a2a2a,#111);border:8px solid var(--white);border-radius:28px;box-shadow:0 22px 50px rgba(0,0,0,.4);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.reel video{width:100%;height:100%;object-fit:cover;display:block;}
.reel::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 8px,transparent 8px 20px);}
.reel .play{width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:2;}
.reel .play::before{content:'';border-style:solid;border-width:26px 0 26px 44px;border-color:transparent transparent transparent var(--red);margin-left:10px;}
.reel .tag{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:rgba(255,255,255,.9);font-size:22px;font-weight:600;letter-spacing:2px;z-index:2;}
.reel .tag small{display:block;font-size:15px;font-weight:500;color:rgba(255,255,255,.6);letter-spacing:1px;margin-top:4px;}

/* contact block (screen 3) */
.contact{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;}
.contact .pedidos{color:var(--green-lt);font-size:40px;font-weight:600;font-style:italic;transform:rotate(-3deg);line-height:.9;}
.contact .llamar{color:var(--green);font-size:150px;font-weight:700;line-height:.82;letter-spacing:2px;}
.contact .tel{color:var(--white);font-size:56px;font-weight:700;letter-spacing:1px;}
.contact .telnote{color:var(--yellow);font-size:20px;font-weight:600;font-style:italic;}
.socials{display:flex;align-items:center;gap:22px;margin-top:14px;}
.socials .follow{color:var(--white);font-size:26px;font-weight:700;font-style:italic;transform:rotate(-4deg);line-height:1;text-align:left;}
.sicon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,0,0,.3);}
.qr{width:150px;height:150px;border-radius:12px;background:#fff;padding:10px;box-shadow:0 8px 18px rgba(0,0,0,.3);}
.qr svg{display:block;width:100%;height:100%;}

/* ---------- color control panel ---------- */
#panel{position:fixed;top:18px;right:18px;z-index:9999;font-family:var(--ff);}
#panel .toggle{background:var(--yellow);color:var(--red-dk);border:none;border-radius:40px;padding:12px 20px;font-family:var(--ff);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.4);}
#panel .body{display:none;margin-top:10px;width:250px;background:#fff;color:#222;border-radius:16px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.5);}
#panel.open .body{display:block;}
#panel h3{font-size:15px;color:var(--red-dk);margin-bottom:12px;}
#panel .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;font-size:13.5px;font-weight:600;color:#333;}
#panel input[type=color]{width:44px;height:30px;border:1px solid #ccc;border-radius:8px;background:none;cursor:pointer;padding:0;}
#panel .reset{width:100%;margin-top:6px;background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px;font-family:var(--ff);font-weight:700;font-size:13.5px;cursor:pointer;}
#panel .hint{margin-top:10px;font-size:11.5px;color:#888;line-height:1.4;font-weight:500;}
@media (max-width:640px){#panel .body{width:210px;}}
</style>

const POR_ENCARGO=new Set(["Picaña","Pulpa de Res","Milanesa de Res","Chuleta de 7","Chuleta de Res","Bistec de Pulpa Blanca","Codorniz","Conejo","Chivo Congelado","Oreja","Pata en Vinagre","Útero","Tocino","Baby Ribs","Baby Ribs Marinada","Hígado","Lengua","Lomo","Molida","Chamorro","Chuleta","Molido","Chorizo","Corazón","Pierna de Pavo","Pescado Pargo","Pescado Corvina","Pescado Macarela","Pulpo","Huachinango","Bacalao Seco","Filete de Tilapia","Huevos de Toro","Labio de Res","Menudo Blanco","Riñón de Res","Corazón de Res","Sesos","Orejas en Vinagre","Discada","Tripa para Chorizo","Chorizo de Res","Chorizo Seco"].map(norm));
function esPorEncargo(nombre){const n=norm(nombre);return POR_ENCARGO.has(n)||n.includes('caja');}
function legend(){return `<div style="position:absolute;left:50%;bottom:23px;transform:translateX(-50%);display:flex;align-items:center;gap:26px;background:var(--white);border-radius:40px;padding:9px 26px;box-shadow:0 10px 26px rgba(0,0,0,.35);pointer-events:none;">
  <span style="display:flex;align-items:center;gap:9px;font-family:var(--ff);font-weight:700;font-size:17px;color:var(--green);"><span style="width:14px;height:14px;border-radius:50%;background:var(--green);display:inline-block;"></span>Siempre disponible</span>
  <span style="display:flex;align-items:center;gap:9px;font-family:var(--ff);font-weight:700;font-size:17px;color:var(--red-dk);"><span style="width:14px;height:14px;border-radius:50%;background:var(--red-dk);display:inline-block;"></span>Solo por encargo</span>
</div>`;}
function legendBig(){return `<div style="position:absolute;left:726px;top:85px;transform:translate(-50%,-50%);display:flex;align-items:center;gap:22px;background:var(--white);border-radius:40px;padding:12px 30px;box-shadow:0 10px 26px rgba(0,0,0,.35);pointer-events:none;">
  <span style="display:flex;align-items:center;gap:10px;font-family:var(--ff);font-weight:700;font-size:20px;color:var(--green);white-space:nowrap;"><span style="width:16px;height:16px;border-radius:50%;background:var(--green);display:inline-block;"></span>Siempre disponible</span>
  <span style="display:flex;align-items:center;gap:10px;font-family:var(--ff);font-weight:700;font-size:20px;color:var(--red-dk);white-space:nowrap;"><span style="width:16px;height:16px;border-radius:50%;background:var(--red-dk);display:inline-block;"></span>Solo por encargo</span>
</div>`;}

function rows(list,nameSize,priceSize){
  return list.map(([n,p])=>{const st=esPorEncargo(n)?'color:var(--red-dk)':'color:var(--green)';return `<div class="pl-row"><span class="pl-name" style="font-size:${nameSize}px;${st}">${n}</span><span class="pl-lead"></span><span class="pl-price" style="font-size:${priceSize}px;${st}">$${p}</span></div>`;}).join('');
}
function head(icon,title,sub,titleSize,iconSize){
  iconSize=iconSize||Math.round(titleSize*1.1);
  return `<div class="sec-head"><span class="icon-badge"><span class="ico" style="font-size:${iconSize}px">${ICON[icon]}</span></span><div><div class="sec-title" style="font-size:${titleSize}px">${title}</div>${sub?`<div class="sec-sub">${sub}</div>`:''}</div></div>`;
}
function twocol(list,ns,ps,gap){gap=gap||34;const h=Math.ceil(list.length/2);return `<div class="card-grid" style="column-gap:${gap}px;"><div class="pl-col">${rows(list.slice(0,h),ns,ps)}</div><div class="pl-col">${rows(list.slice(h),ns,ps)}</div></div>`;}
/* header invisible: reserva el mismo alto que head() para alinear un slot de imagen/video con la tarjeta vecina */
function headSpacer(titleSize,iconSize){
  iconSize=iconSize||Math.round(titleSize*1.1);
  return `<div class="sec-head" style="visibility:hidden;"><span class="icon-badge"><span class="ico" style="font-size:${iconSize}px">•</span></span><div><div class="sec-title" style="font-size:${titleSize}px">.</div></div></div>`;
}

/* ---------------- IMÁGENES INTERCAMBIABLES ----------------
   Reemplazar por la URL final. El tamaño mostrado abajo es el recomendado
   para que la imagen llene el espacio sin recortes raros (object-fit:cover). */
let PROMO_IMG="https://placehold.co/768x552/ffde59/7a4a12?text=PROMO+DE+LA+SEMANA%0A768x552px";
let CONTACT_IMG="https://placehold.co/876x322/00843D/ffffff?text=PEDIDOS+e+INFO+%C2%B7+LLAMAR%0A876x322px";
/* Video vertical (reel), Pantalla 2: 320x846px, loop sin cortes (sin audio en la TV).
   Pegar la URL del .mp4 final acá — se reproduce en loop automáticamente. Vacío = placeholder. */
let VIDEO_SRC="";

/* social icons */
const FB=`<div class="sicon" style="background:#1877F2"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M22 12a10 10 0 10-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0022 12z"/></svg></div>`;
const IG=`<div class="sicon" style="background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="#fff" stroke="none"/></svg></div>`;
/* fake QR (decorativo) */
function fakeQR(){let c='';for(let y=0;y<11;y++){for(let x=0;x<11;x++){const corner=(x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);const on=corner?((x===0||x===2||x===8||x===10||y===0||y===2||y===8||y===10)|| (x>=0&&x<3&&y>=0&&y<3&&(x===1&&y===1))||(x>7&&x<11&&y<3&&x===9&&y===1)||(x<3&&y>7&&x===1&&y===9)) : Math.random()>.5;if(on)c+=`<rect x="${x*13+2}" y="${y*13+2}" width="12" height="12" fill="#111"/>`;}}return `<svg viewBox="0 0 147 147">${c}</svg>`;}

/* ---------------- RENDER (llamado al cargar y cada vez que llegan datos del Sheet) ---------------- */

function renderAll(){
document.getElementById('screen3').innerHTML=`
<div class="canvas">

  <!-- MARISCOS top-left -->

/* ---------------- DATOS EN VIVO (Google Sheet vía Apps Script) ----------------
   Mismo backend/Sheet que el menú del restaurante (hojas RES, ESPECIALES, PUERCO,
   POLLO, MARISCOS, VISCERAS, EMBUTIDOS + CONFIG con promoImg/contactImg/videoSrc).
   ?mode=draft en la URL de esta página muestra el borrador del admin sin publicar. */
const APPS_SCRIPT_URL_CARNICERIA="https://script.google.com/macros/s/AKfycbzALLWnYC4GVS23_Zg45GNbKB8F3Ru1iFgKXN-3i8BzKyW0RrVn6Ea-qYVkdIfeYw3N/exec";
const _MODE_CARN=new URLSearchParams(location.search).get("mode");
const _DATA_URL_CARNICERIA=APPS_SCRIPT_URL_CARNICERIA+(_MODE_CARN==="draft"?"?mode=draft&t=":"?t=");
const CACHE_KEY="carniceriaMenuCache";

function toPairs(list){return (list||[]).filter(it=>it.disponible!==false).map(it=>[it.nombre,it.precio]);}

function applyData(data){
  if(data.res && data.res.length)RES=toPairs(data.res);
  if(data.especiales && data.especiales.length)ESPECIALES=toPairs(data.especiales);
  if(data.puerco && data.puerco.length)PUERCO=toPairs(data.puerco);
  if(data.pollo && data.pollo.length)POLLO=toPairs(data.pollo);
  if(data.mariscos && data.mariscos.length)MARISCOS=toPairs(data.mariscos);
  if(data.visceras && data.visceras.length)VISCERAS=toPairs(data.visceras);
  if(data.embutidos && data.embutidos.length)EMBUTIDOS=toPairs(data.embutidos);
  if(data.promoImg)PROMO_IMG=data.promoImg;
  if(data.contactImg)CONTACT_IMG=data.contactImg;
  if(data.videoSrc!==undefined)VIDEO_SRC=data.videoSrc;
  renderAll();
  scaleAll();
  hideSplashes();
}
let _splashInit=false;
function hideSplashes(){
  if(_splashInit)return;
  _splashInit=true;
  const _w=Math.max(0,2800-(Date.now()-(window.__T0__||0)));
  setTimeout(function(){
    ['splash1','splash2','splash3'].forEach(function(id){const sp=document.getElementById(id);if(sp)sp.classList.add('hide');});
  },_w);
}

async function loadFromSheet(){
  if(!APPS_SCRIPT_URL_CARNICERIA)return;
  try{
    const r=await fetch(_DATA_URL_CARNICERIA+Date.now());
    const data=await r.json();
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(data));}catch(_e){}
    applyData(data);
  }catch(_e){ /* sin internet o Sheet caído: se queda con lo último que haya (caché o muestra) */ }
}
try{
  const cached=localStorage.getItem(CACHE_KEY);
  if(cached)applyData(JSON.parse(cached));
}catch(_e){}
loadFromSheet();
setInterval(loadFromSheet,30000);

/* ---------------- SCALING ---------------- */
function scaleAll(){
  const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  const scr=document.getElementById('screen3');
  scr.style.transform='scale('+s+')';
  scr.style.left=((window.innerWidth-1920*s)/2)+'px';
  scr.style.top=((window.innerHeight-1080*s)/2)+'px';
  const sp=document.getElementById('splash3');
  if(sp){sp.style.transform='scale('+s+')';sp.style.left=scr.style.left;sp.style.top=scr.style.top;}
  document.body.style.background='#E31837';
}
window.addEventListener('resize',scaleAll);
scaleAll();
setTimeout(scaleAll,60);

</script>
